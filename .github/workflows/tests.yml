name: Handoff tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  package:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/package_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCADMakeraBridge-install
          path: dist/FreeCADMakeraBridge-install.zip
